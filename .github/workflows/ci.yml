name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test with coverage
        run: yarn test --coverage --maxWorkers=2

      - name: Build package
        run: yarn prepare

  # build-ios:
  #   runs-on: macos-latest
  #   # Compiling ios/ against the iOS 27.1 SDK needs a runner with Xcode 27.1+.
  #   # GitHub-hosted macOS images may lag; native behaviour is verified on the
  #   # iPhone Duo simulator outside CI until an appropriate runner is available.
