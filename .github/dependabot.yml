version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # React Native is 0.x, so its "minor" bumps are breaking; RN upgrades are manual.
    ignore:
      - dependency-name: react
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-test-renderer
      - dependency-name: '@react-native/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: '@eslint/*'
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: '@babel/*'
        update-types:
          - version-update:semver-major
      - dependency-name: babel-jest
        update-types:
          - version-update:semver-major
      - dependency-name: jest
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/jest'
        update-types:
          - version-update:semver-major
      - dependency-name: prettier
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - '*'
