name: 🐛 Bug report
description: Report a reproducible bug or regression in this library.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Security vulnerabilities:** do not file a public issue — use [private vulnerability reporting](https://github.com/RRigueira/react-native-iphone-duo/security/advisories/new) (see [SECURITY.md](https://github.com/RRigueira/react-native-iphone-duo/blob/main/SECURITY.md)).
  - type: checkboxes
    attributes:
      label: Before submitting
      description: Please check these first.
      options:
        - label: I tested with the latest published version of the library.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security report (those go through private advisory reporting).
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Clear description of what went wrong. Include stack traces if relevant.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: Version of `react-native-iphone-duo`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: rn-version
    attributes:
      label: React Native version
      placeholder: "0.88.0"
    validations:
      required: true
  - type: dropdown
    id: project-type
    attributes:
      label: Project type
      options:
        - Expo (dev build / prebuild)
        - Bare React Native
      default: 0
    validations:
      required: true
  - type: input
    id: expo-sdk
    attributes:
      label: Expo SDK (if Expo)
      description: Leave blank for bare RN.
      placeholder: "58"
    validations:
      required: false
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      description: The signals need iOS 27.1 or later.
      placeholder: "iOS 27.2"
    validations:
      required: true
  - type: dropdown
    id: device-type
    attributes:
      label: Device / simulator
      options:
        - iPhone Duo simulator
        - iPhone Duo (physical device)
        - Other iPhone or iPad (simulator or device)
        - Android
      default: 0
    validations:
      required: true
  - type: dropdown
    id: posture
    attributes:
      label: Posture when it happens
      options:
        - Closed (cover display)
        - Open flat (inner display)
        - Partially open
        - Inner display in portrait
        - Not applicable
      default: 0
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Value returned by the library
      description: What `getState()` (or the hook) returned, ideally as JSON, and what you expected instead.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. …
        2. …
    validations:
      required: true
